<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Switchyards — Roadmap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; }
  body { background:#F4EFE3; color:#1B2A78; font-family:'Space Mono',monospace; -webkit-font-smoothing:antialiased; }
  @keyframes syPulse { 0%,100%{opacity:1;transform:scale(1);} 50%{opacity:.3;transform:scale(.6);} }

  .wrap { max-width:1680px; margin:0 auto; padding:52px 60px 68px; }
  .board { display:grid; grid-template-columns:repeat(4,1fr); gap:22px; align-items:start; margin-top:38px; min-width:1080px; }
  .col { display:flex; flex-direction:column; gap:16px; }
  .col-head { display:flex; align-items:center; justify-content:space-between; padding-bottom:12px; border-bottom:2px solid #1B2A78; }
  .col-list { display:flex; flex-direction:column; gap:14px; min-height:40px; border-radius:10px; transition:background .12s ease; }
  .col-list.drop-hint { background:rgba(27,42,120,.05); outline:2px dashed rgba(27,42,120,.35); outline-offset:4px; }

  .card { position:relative; border-radius:8px; padding:17px; transition:transform .12s ease, box-shadow .12s ease, border-color .12s ease, opacity .12s ease; }
  body.can-edit .card { cursor:grab; }
  body.can-edit .card:active { cursor:grabbing; }
  .card.dragging { opacity:.4; }
  .card[data-kind="active"]  { background:#FCFAF3; border:1.5px solid #1B2A78; border-top:6px solid #1B2A78; box-shadow:4px 4px 0 #1B2A78; }
  .card[data-kind="active"]:hover  { transform:translate(-2px,-2px); box-shadow:6px 6px 0 #1B2A78; }
  .card[data-kind="planned"] { background:#FCFAF3; border:1.5px solid #1B2A78; }
  .card[data-kind="planned"]:hover { transform:translate(-2px,-2px); box-shadow:5px 5px 0 #1B2A78; }
  .card[data-kind="backlog"] { background:transparent; border:1.5px dashed #A9A6C2; }
  .card[data-kind="backlog"]:hover { border-color:#1B2A78; }
  .card[data-kind="later"]   { background:transparent; border:1.5px dashed #C3C0D6; opacity:.92; }
  .card[data-kind="later"]:hover { opacity:1; border-color:#8A88A6; }

  .card h3 { margin:0; font-family:'Newsreader',serif; font-weight:600; font-size:20px; line-height:1.15; outline:none; }
  .card[data-kind="backlog"] h3 { font-weight:500; font-size:19px; color:#3B406E; }
  .card[data-kind="later"] h3 { font-weight:500; font-size:19px; color:#5B6091; }
  .card .sub { margin:5px 0 0; font-size:12px; line-height:1.45; color:#5B6091; outline:none; }

  ul.items { list-style:none; margin:11px 0 0; padding:11px 0 0; display:flex; flex-direction:column; gap:8px; border-top:1px dashed #C3C0D6; }
  ul.items:empty { border-top:none; margin:0; padding:0; }
  ul.items li { display:flex; gap:9px; font-size:12px; line-height:1.45; color:#3B406E; }
  ul.items li .mk { color:#1B2A78; font-weight:700; flex:0 0 auto; }
  ul.items li .txt { outline:none; flex:1; }
  ul.items li .del-bullet { flex:0 0 auto; opacity:0; cursor:pointer; color:#C15; font-weight:700; padding:0 2px; }
  ul.items li:hover .del-bullet { opacity:.7; }
  .card[data-kind="later"] ul.items { border-top-color:#D3D0E0; }
  .card[data-kind="later"] ul.items li, .card[data-kind="later"] ul.items li .mk { color:#8A88A6; }
  .card[data-kind="backlog"] ul.items { border-top-color:#A9A6C2; }
  .flag { font-style:normal; background:#F7E839; padding:0 4px; color:#1B2A78; }

  [contenteditable="true"][data-empty]:empty:before { content:attr(data-empty); color:#B7B4CC; }

  .card-tools { position:absolute; top:8px; right:8px; display:flex; gap:6px; opacity:0; transition:opacity .12s ease; }
  .card:hover .card-tools { opacity:1; }
  .card-tools button { font-family:'Space Mono',monospace; font-size:11px; line-height:1; border:1.5px solid #1B2A78; background:#F4EFE3; color:#1B2A78; border-radius:6px; padding:3px 6px; cursor:pointer; }
  .card-tools button:hover { background:#1B2A78; color:#F4EFE3; }

  .add-item { font-family:'Space Mono',monospace; font-size:12px; letter-spacing:.08em; text-transform:uppercase; border:1.5px dashed #A9A6C2; background:transparent; color:#5B6091; border-radius:8px; padding:11px; cursor:pointer; transition:border-color .12s ease, color .12s ease; }
  .add-item:hover { border-color:#1B2A78; color:#1B2A78; }

  body:not(.can-edit) .card-tools,
  body:not(.can-edit) .add-item,
  body:not(.can-edit) .del-bullet { display:none; }

  .savebar { position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:#1B2A78; color:#F4EFE3; font-size:12px; letter-spacing:.1em; text-transform:uppercase; padding:8px 16px; border-radius:999px; opacity:0; transition:opacity .3s ease; pointer-events:none; }
  .savebar.show { opacity:1; }
  .savebar.err { background:#B3261E; }

  .banner { background:#F7E839; color:#1B2A78; font-size:12px; letter-spacing:.06em; text-align:center; padding:7px 14px; }

  .auth { display:flex; align-items:center; gap:8px; font-size:12px; letter-spacing:.06em; }
  .auth button { font-family:'Space Mono',monospace; font-size:12px; letter-spacing:.08em; text-transform:uppercase; border:1.5px solid #1B2A78; background:#F4EFE3; color:#1B2A78; border-radius:999px; padding:7px 14px; cursor:pointer; }
  .auth button:hover { background:#1B2A78; color:#F4EFE3; }
  .auth input { font-family:'Space Mono',monospace; font-size:12px; border:1.5px solid #1B2A78; border-radius:999px; padding:7px 12px; background:#FCFAF3; color:#1B2A78; outline:none; width:210px; }
  .auth .who { color:#5B6091; }
</style>
</head>
<body>

<div class="banner" id="banner">Loading the roadmap…</div>

<div class="wrap">

  <!-- HEADER -->
  <div style="display:flex; justify-content:space-between; align-items:center; gap:24px; flex-wrap:wrap;">
    <div style="display:flex; align-items:center; gap:14px;">
      <svg width="44" height="44" viewBox="0 0 44 44" style="display:block; border-radius:8px;"><rect width="44" height="44" rx="8" fill="#1B2A78"/><text x="22" y="31" font-family="Newsreader,Georgia,serif" font-size="24" font-weight="700" fill="#F4EFE3" text-anchor="middle">S</text></svg>
      <span style="font-weight:700; letter-spacing:.26em; font-size:14px; text-transform:uppercase;">Switchyards</span>
    </div>
    <div style="display:flex; align-items:center; gap:14px; flex-wrap:wrap;">
      <div class="auth" id="auth"></div>
      <span style="display:inline-flex; align-items:center; gap:8px; padding:8px 15px; background:#1B2A78; color:#F4EFE3; border-radius:999px; font-size:12px; letter-spacing:.14em; text-transform:uppercase;"><span style="width:8px; height:8px; border-radius:999px; background:#35C05A;"></span>H2 2026.</span>
    </div>
  </div>

  <!-- TITLE -->
  <div style="padding:44px 0 8px; display:flex; flex-direction:column; gap:12px;">
    <span style="display:inline-block; align-self:flex-start; background:#F7E839; color:#1B2A78; padding:3px 12px 5px; font-size:13px; letter-spacing:.24em; text-transform:uppercase; transform:rotate(-1.4deg);">Website &amp; App</span>
    <h1 style="margin:0; font-family:'Newsreader',serif; font-weight:700; font-size:clamp(52px,7vw,104px); line-height:.9; letter-spacing:-.015em;">The Roadmap.</h1>
    <p style="margin:8px 0 0; max-width:600px; font-size:14px; line-height:1.65; color:#5B6091;">Where the work is, where it's headed, and what's parked for later.</p>
  </div>

  <!-- BOARD -->
  <div class="board" id="board"></div>

  <!-- FOOTER -->
  <div style="margin-top:46px; padding-top:18px; border-top:2px solid #1B2A78; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:#8A88A6;">
    <span>Switchyards Inc. — Product &amp; Engineering</span>
    <span id="stamp">Live roadmap</span>
  </div>

</div>

<div class="savebar" id="savebar">Saved</div>

<script>
// ================== CONFIG ==================
const SUPABASE_URL = "https://vramxfveilqzkgnnyfix.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZyYW14ZnZlaWxxemtnbm55Zml4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQyMTIyODAsImV4cCI6MjA5OTc4ODI4MH0.Plcty8r5MkqyadOERQQZ_ydyWPzswpmYMRcqYQOz690";
const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ---- Default content, used until the first shared save ----
const SEED = {
  columns: [
    { id:"in-progress", label:"In Progress", kind:"active",  dot:"pulse",   badge:"filled" },
    { id:"planned",     label:"Planned",     kind:"planned", dot:"square",  badge:"outline" },
    { id:"backlog",     label:"Backlog",     kind:"backlog", dot:"hollow",  badge:"muted" },
    { id:"later",       label:"Later",       kind:"later",   dot:"arrow",   badge:"faint" },
  ],
  items: {
    "in-progress": [
      { title:"Checkout Foundation", sub:"Staging & release process foundation", bullets:[] },
      { title:"Prepare for App Handover", bullets:["Reviewing app and documenting findings"] },
      { title:"Code Quality & Stability", bullets:[] },
      { title:"Tech Debt", bullets:["Rotate hardcoded OpenPath credentials and move to Supabase secrets"] },
      { title:"Bugs", bullets:["Reserved 10–15% of sprint capacity for bugs as reported"] },
    ],
    "planned": [
      { title:"New Member Onboarding Experience", bullets:[
        "Checkout page split <em class='flag'>(in flight)</em>",
        "Terms & conditions friction and read tracking",
        "Decouple success page from conversion pixels",
        "HubSpot identity linkage on success page" ] },
      { title:"Referral Program Integration <span style='color:#9195B5'>— Phase 1</span>", bullets:[
        "Conversion pixel firing, referral param passthrough, staging" ] },
    ],
    "backlog": [
      { title:"Backend Security & Reliability Tech Debt", bullets:[] },
      { title:"Switchyards API Tech Debt", bullets:[
        "<strong>Hardcoded credentials</strong> — production passwords and MongoDB URIs committed to source code and git history",
        "<strong>Broken password hashing</strong> — SHA-256 used instead of bcrypt (which is imported but never called)",
        "<strong>Non-expiring JWTs</strong> — tokens valid forever with no revocation mechanism",
        "<strong>Unauthenticated admin endpoints</strong> — employee-management endpoint has no auth check",
        "<strong>Massive code duplication</strong> — 6 near-identical checkout endpoint versions; same patterns repeated 15+ times" ] },
      { title:"Staging Environment for switchyards.com", bullets:[
        "Build staging environment to support release process" ] },
    ],
    "later": [
      { title:"Internal UAT of App", bullets:[] },
      { title:"Referral Program Integration <span style='color:#A9A6C2'>— Phase 2</span>", bullets:[
        "Stripe-connected for member referral discounts (automated)" ] },
    ],
  }
};

const board   = document.getElementById("board");
const banner  = document.getElementById("banner");
const savebar = document.getElementById("savebar");
const authBox = document.getElementById("auth");
const stamp   = document.getElementById("stamp");

let data = structuredClone(SEED);
let canEdit = false;
let pendingRemote = null;

// ================== RENDER ==================
function dotHTML(kind){
  if(kind==="pulse")  return '<span style="width:9px;height:9px;border-radius:999px;background:#35C05A;animation:syPulse 1.6s ease-in-out infinite;"></span>';
  if(kind==="square") return '<span style="width:9px;height:9px;border-radius:2px;background:#1B2A78;"></span>';
  if(kind==="hollow") return '<span style="width:9px;height:9px;border-radius:2px;border:2px solid #1B2A78;"></span>';
  return '<span style="font-size:13px;">→</span>';
}
function badgeHTML(kind,n){
  if(kind==="filled")  return '<span style="font-size:12px;color:#F4EFE3;background:#1B2A78;padding:2px 9px;border-radius:999px;">'+n+'</span>';
  if(kind==="outline") return '<span style="font-size:12px;color:#1B2A78;border:1.5px solid #1B2A78;padding:1px 8px;border-radius:999px;">'+n+'</span>';
  if(kind==="muted")   return '<span style="font-size:12px;color:#5B6091;border:1.5px solid #B7B4CC;padding:1px 8px;border-radius:999px;">'+n+'</span>';
  return '<span style="font-size:12px;color:#8A88A6;border:1.5px solid #CFCCDE;padding:1px 8px;border-radius:999px;">'+n+'</span>';
}
function labelColor(kind){ return kind==="backlog" ? "#5B6091" : kind==="later" ? "#8A88A6" : "#1B2A78"; }

function bulletLi(html){
  const li = document.createElement("li");
  li.innerHTML = '<span class="mk">›</span><span class="txt" data-empty="describe this item…">'+html+'</span><span class="del-bullet" title="remove">×</span>';
  li.querySelector(".txt").contentEditable = canEdit;
  li.querySelector(".del-bullet").onclick = () => { li.remove(); save(); };
  return li;
}
function makeCard(kind, item){
  const card = document.createElement("article");
  card.className = "card"; card.dataset.kind = kind; card.draggable = canEdit;
  const h3 = document.createElement("h3");
  h3.contentEditable = canEdit; h3.dataset.empty = "Untitled…"; h3.innerHTML = item.title || "";
  card.appendChild(h3);
  if(item.sub !== undefined){
    const p = document.createElement("p"); p.className="sub"; p.contentEditable=canEdit; p.dataset.empty="add a one-line note…"; p.textContent=item.sub;
    card.appendChild(p);
  }
  const ul = document.createElement("ul"); ul.className="items";
  (item.bullets||[]).forEach(b => ul.appendChild(bulletLi(b)));
  card.appendChild(ul);
  const tools = document.createElement("div"); tools.className="card-tools";
  const addB = document.createElement("button"); addB.textContent="+ bullet";
  addB.onclick = () => { const li = bulletLi(""); ul.appendChild(li); li.querySelector(".txt").focus(); save(); };
  const delB = document.createElement("button"); delB.textContent="×"; delB.title="delete card";
  delB.onclick = () => { if(confirm("Delete this card?")){ card.remove(); save(); } };
  tools.append(addB, delB); card.appendChild(tools);
  return card;
}
function render(){
  document.body.classList.toggle("can-edit", canEdit);
  board.innerHTML = "";
  data.columns.forEach(col => {
    const section = document.createElement("section"); section.className="col";
    const head = document.createElement("div"); head.className="col-head";
    head.innerHTML = '<div style="display:flex;align-items:center;gap:9px;">'+dotHTML(col.dot)+
      '<span style="font-weight:700;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:'+labelColor(col.kind)+';">'+col.label+'</span></div>';
    const badgeSlot = document.createElement("span");
    head.appendChild(badgeSlot);
    section.appendChild(head);

    const list = document.createElement("div"); list.className="col-list"; list.dataset.col = col.id;
    (data.items[col.id]||[]).forEach(item => list.appendChild(makeCard(col.kind, item)));
    section.appendChild(list);

    const add = document.createElement("button"); add.className="add-item"; add.textContent="+ Add item";
    add.onclick = () => { const c = makeCard(col.kind, {title:"", bullets:[]}); list.appendChild(c); c.querySelector("h3").focus(); save(); };
    section.appendChild(add);

    board.appendChild(section);
    refreshBadge(list, badgeSlot, col.badge);
    wireDnD(list);
  });
}
function refreshBadge(list, slot, kind){ slot.innerHTML = badgeHTML(kind, list.querySelectorAll(".card").length); }

// ================== DRAG & DROP ==================
let dragged = null;
function wireDnD(list){
  list.addEventListener("dragover", e => {
    if(!canEdit) return;
    e.preventDefault();
    list.classList.add("drop-hint");
    const after = afterElement(list, e.clientY);
    if(!dragged) return;
    if(after == null) list.appendChild(dragged);
    else list.insertBefore(dragged, after);
  });
  list.addEventListener("dragleave", e => { if(!list.contains(e.relatedTarget)) list.classList.remove("drop-hint"); });
  list.addEventListener("drop", e => { e.preventDefault(); list.classList.remove("drop-hint"); });
}
function afterElement(list, y){
  const els = [...list.querySelectorAll(".card:not(.dragging)")];
  let best = { offset:-Infinity, el:null };
  for(const child of els){
    const box = child.getBoundingClientRect();
    const offset = y - box.top - box.height/2;
    if(offset < 0 && offset > best.offset) best = { offset, el:child };
  }
  return best.el;
}
board.addEventListener("dragstart", e => { if(!canEdit) return; const c = e.target.closest(".card"); if(!c) return; dragged = c; c.classList.add("dragging"); });
board.addEventListener("dragend", () => { if(dragged){ dragged.classList.remove("dragging"); dragged=null; } document.querySelectorAll(".col-list").forEach(l=>l.classList.remove("drop-hint")); save(); });

// ================== SAVE / SYNC ==================
function serialize(){
  const cols = [...board.querySelectorAll(".col-list")];
  cols.forEach(list => {
    const id = list.dataset.col;
    data.items[id] = [...list.querySelectorAll(".card")].map(card => {
      const item = { title: card.querySelector("h3").innerHTML.trim() };
      const sub = card.querySelector(".sub");
      if(sub) item.sub = sub.textContent.trim();
      item.bullets = [...card.querySelectorAll("ul.items .txt")].map(t => t.innerHTML.trim()).filter(Boolean);
      return item;
    });
    const kind = data.columns.find(c=>c.id===id).badge;
    const slot = list.closest(".col").querySelector(".col-head > span");
    refreshBadge(list, slot, kind);
  });
}
let saveTimer=null, pushTimer=null;
function flash(msg, isErr){
  savebar.textContent = msg;
  savebar.classList.toggle("err", !!isErr);
  clearTimeout(saveTimer); savebar.classList.add("show");
  saveTimer = setTimeout(()=>savebar.classList.remove("show"), isErr ? 3000 : 900);
}
function save(){
  if(!canEdit) return;
  serialize();
  clearTimeout(pushTimer);
  pushTimer = setTimeout(pushToDb, 600);
}
async function pushToDb(){
  flash("Saving…");
  const { error } = await db.from("roadmap")
    .update({ data: data, updated_at: new Date().toISOString() })
    .eq("id", 1);
  if(error){ flash("Couldn't save — check your login", true); }
  else { flash("Saved for everyone"); }
}
board.addEventListener("input", e => { if(e.target.isContentEditable) save(); });
board.addEventListener("focusout", () => {
  if(pendingRemote && !board.contains(document.activeElement)){
    data = pendingRemote; pendingRemote = null; render();
  }
});

// ================== AUTH (shared password) ==================
const EDITOR_EMAIL = "roadmap-editor@switchyards.com"; // fixed shared editor account; the password is the gate
function renderAuth(session){
  authBox.innerHTML = "";
  if(session){
    const who = document.createElement("span"); who.className="who"; who.textContent = "Editing ✓";
    const out = document.createElement("button"); out.textContent = "Done";
    out.onclick = async () => { await db.auth.signOut(); };
    authBox.append(who, out);
    banner.textContent = "You're editing the live roadmap — changes save for everyone automatically.";
  } else {
    const btn = document.createElement("button"); btn.textContent = "Enter password to edit";
    btn.onclick = () => {
      authBox.innerHTML = "";
      const input = document.createElement("input"); input.type="password"; input.placeholder="password"; input.style.width="150px";
      const send = document.createElement("button"); send.textContent = "Unlock";
      send.onclick = async () => {
        const pw = input.value;
        if(!pw){ input.focus(); return; }
        send.disabled = true; send.textContent = "Checking…";
        const { error } = await db.auth.signInWithPassword({ email: EDITOR_EMAIL, password: pw });
        if(error){ flash("Wrong password", true); send.disabled=false; send.textContent="Unlock"; input.value=""; input.focus(); }
        // success is handled by onAuthStateChange
      };
      input.addEventListener("keydown", e => { if(e.key==="Enter") send.onclick(); });
      const cancel = document.createElement("button"); cancel.textContent="✕"; cancel.title="cancel"; cancel.onclick=()=>renderAuth(null);
      authBox.append(input, send, cancel);
      input.focus();
    };
    authBox.append(btn);
    banner.textContent = "Live roadmap — you're viewing. Enter the password (top right) to edit.";
  }
}
function setAuth(session){
  canEdit = !!session;
  renderAuth(session);
  render();
}

// ================== LIVE UPDATES ==================
db.channel("roadmap-live")
  .on("postgres_changes", { event:"UPDATE", schema:"public", table:"roadmap", filter:"id=eq.1" }, payload => {
    const incoming = payload.new && payload.new.data;
    if(!incoming || !incoming.columns) return;
    if(JSON.stringify(incoming) === JSON.stringify(data)) return;
    const editingNow = board.contains(document.activeElement) && document.activeElement.isContentEditable;
    if(editingNow){ pendingRemote = incoming; }
    else { data = incoming; render(); }
  })
  .subscribe();

// ================== BOOT ==================
(async function init(){
  try{
    const { data: row, error } = await db.from("roadmap").select("data, updated_at").eq("id", 1).maybeSingle();
    if(!error && row && row.data && row.data.columns){ data = row.data; }
    if(!error && row && row.updated_at){ stamp.textContent = "Live · updated " + new Date(row.updated_at).toLocaleDateString(); }
  }catch(e){ /* fall back to SEED */ }
  render();
  db.auth.onAuthStateChange((_evt, session) => setAuth(session));
  const { data: s } = await db.auth.getSession();
  setAuth(s ? s.session : null);
})();
</script>
</body>
</html>
